server:
  port: 8080

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/auth/realms/rental-app
      client:
        registration:
          gateway-service:
            provider: keycloak
            client-id: gateway-service
            client-secret: o4fqE7L8Dn5oO8G4HhlGRX05YKSaAmj2
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: http://localhost:9090/auth/realms/rental-app/protocol/openid-connect/token

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

keycloak:
  base-url: http://localhost:9090/auth
  realm: rental-app
