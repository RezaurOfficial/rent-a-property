server:
  port: 8082

spring:
  application:
    name: rental-service

  datasource:
    url: jdbc:h2:mem:rentaldb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/auth/realms/rental-app
      client:
        registration:
          rental-service:
            provider: keycloak
            client-id: rental-service
            client-secret: oGoHDCKE51SxKNuRFggiHVwWfwI21lxA
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: http://localhost:9090/auth/realms/rental-app/protocol/openid-connect/token

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
